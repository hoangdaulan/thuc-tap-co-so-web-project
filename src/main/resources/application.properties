spring.application.name=WebFastFood


# Database configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WebFastFood;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456

# Driver class
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Tăng số lượng kết nối tối đa
spring.datasource.hikari.maximum-pool-size=20
# Thời gian chờ tối đa cho một kết nối (ms)
spring.datasource.hikari.connection-timeout=20000
# Thời gian sống của một kết nối
spring.datasource.hikari.idle-timeout=300000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwtExpirationInMs=864000000

# Upload file size limits (fix 413 Content Too Large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB