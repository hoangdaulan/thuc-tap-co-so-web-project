spring.application.name=WebFastFood

# --- C?U HÌNH DATABASE SQL SERVER ---
# L?u ý: Port m?c ??nh c?a SQL Server là 1433. N?u máy b?n cài port khác thì nh? ??i l?i.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WebFastFood;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456

# Driver class cho SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# T?ng s? l??ng k?t n?i t?i ?a
spring.datasource.hikari.maximum-pool-size=20
# Th?i gian ch? t?i ?a cho m?t k?t n?i (ms)
spring.datasource.hikari.connection-timeout=20000
# Th?i gian s?ng c?a m?t k?t n?i
spring.datasource.hikari.idle-timeout=300000

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Dialect chu?n cho SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# --- C?U HÌNH SERVER & KHÁC ---
server.port=8080

spring.jackson.serialization.indent_output=true

app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwtExpirationInMs=864000000

# Upload file size limits (fix 413 Content Too Large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB